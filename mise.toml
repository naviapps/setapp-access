[settings]
activate_aggressive = true

[tools]
python = "3.15.1"
uv = "0.13.6"
ruff = "0.17.3"
dprint = "0.64.3"
swiftlint = { version = "0.65.1", os = ["macos"] }
actionlint = "1.7.12"
shellcheck = { version = "0.11.0", os = ["macos", "linux"] }

[tasks.lint]
description = "Check owned Swift, Python and documentation without running the vendor SDK"
run = "mise run sdk-tooling -- quality check"

[tasks.format]
description = "Format owned source while preserving original notices"
run = "mise run sdk-tooling -- quality format"

[tasks.sdk-tooling]
run = "uvx --from git+https://github.com/naviapps/sdk-tooling.git@5e81874d4864541b5eace3ebce2eb407ef868739 sdk-tooling"
