name: macOS SDK checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-sdk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  swift:
    name: Swift checks (macOS ${{ matrix.macos }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - macos: "26"
            runner: macos-26
            xcode: /Applications/Xcode_26.6.app/Contents/Developer
          - macos: "27"
            runner: xcode-27
            xcode: /Applications/Xcode_27.2.app/Contents/Developer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: ${{ matrix.xcode }}
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Check Swift toolchain
        run: |
          sw_vers
          xcrun swift --version
      - name: Test Swift SDK and standalone Swift consumer
        shell: bash
        env:
          MACOS_VERSION: ${{ matrix.macos }}
        run: |
          swift_flags=(-Xswiftc -strict-concurrency=complete)
          consumer_flags=(--build-system swiftbuild)
          # SwiftPM 6.3's Swift Build passes -suppress-warnings to SetappResources.
          if [[ "$MACOS_VERSION" == "26" ]]; then
            consumer_flags+=(--allow-warnings)
          else
            swift_flags+=(-Xswiftc -warnings-as-errors)
          fi
          xcrun swift test --build-system swiftbuild "${swift_flags[@]}"
          python3 -B tools/consumer.py "${consumer_flags[@]}"
  distribution:
    name: SDK distribution checks
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Check Swift toolchain
        run: xcrun swift --version
      - name: Install maintainer tools
        uses: jdx/mise-action@v5.3.0
        with:
          version: "2026.11.12"
          cache: false
          add_shims_to_path: false
      - name: Check source and maintainer tools
        run: mise exec -- make check-distribution
