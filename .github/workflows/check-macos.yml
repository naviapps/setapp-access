name: macOS SDK checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-sdk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  swift:
    uses: naviapps/sdk-tooling/.github/workflows/check-sdk-swift.yml@2ec2db1d8629260420885a5c8a9e0f836cdead6f
    with:
      swift-build: true
      allow-swift-6-3-warnings: true
  distribution:
    name: Source and tooling checks
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Check Swift toolchain
        run: xcrun swift --version
      - name: Install maintainer tools
        uses: jdx/mise-action@v5.3.0
        with:
          version: "2026.11.12"
          cache: false
          add_shims_to_path: false
      - name: Check source and maintainer tools
        run: mise exec -- make check-distribution
