name: macOS SDK checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-sdk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Check Swift toolchain
        run: xcrun swift --version
      - name: Install tools for standalone consumers and artifacts
        uses: jdx/mise-action@v5.3.0
        with:
          version: "2026.11.12"
          cache: false
          add_shims_to_path: false
      - name: Validate SDK and consumers
        run: mise exec -- make check
  macos-26:
    name: macOS 26 compatibility
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Check Swift toolchain
        run: xcrun swift --version
      # SwiftPM 6.3's Swift Build passes -suppress-warnings to SetappResources.
      - name: Test Swift SDK
        run: xcrun swift test --build-system swiftbuild -Xswiftc -strict-concurrency=complete
      - name: Build macOS adapter
        run: xcrun swift build --build-system swiftbuild --target SetappAccessMacOS -Xswiftc -strict-concurrency=complete
