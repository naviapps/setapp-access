name: SDK checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    uses: naviapps/sdk-tooling/.github/workflows/plan-checks.yml@5b8ed6b1de70b0d7f0cf78519fd9fb1cbdf1f11a
  swift:
    needs: plan
    if: ${{ needs.plan.outputs.documentation-only != 'true' }}
    name: Swift
    uses: naviapps/sdk-tooling/.github/workflows/check-swift.yml@5b8ed6b1de70b0d7f0cf78519fd9fb1cbdf1f11a
