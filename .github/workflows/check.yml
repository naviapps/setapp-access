name: SDK checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    uses: naviapps/sdk-tooling/.github/workflows/plan-checks.yml@9ff679a53617d014c0c85345894dfe1bd54c3974
  swift:
    needs: plan
    if: ${{ needs.plan.outputs.documentation-only != 'true' }}
    name: Swift
    uses: naviapps/sdk-tooling/.github/workflows/check-swift.yml@9ff679a53617d014c0c85345894dfe1bd54c3974
